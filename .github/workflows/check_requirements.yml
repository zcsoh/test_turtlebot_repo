name: ROS 2 Dependency Check and Build

on:
  push:
    branches:
      - main  # Or master, or your default branch
  pull_request:
    branches:
      - main  # Or master, or your default branch

env:
  # Set the correct ROS distribution for installation and dependency resolution
  ROS_DISTRO: humble

jobs:
  build:
    # CRITICAL: Use the official Ubuntu version for ROS 2 Humble
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS 2 Environment (Humble Base)
        run: |
          # 1. Setup locale and add ROS 2 repository
          sudo locale-gen en_US en_US.UTF-8
          sudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          
          sudo apt update
          sudo apt install -y software-properties-common curl
          sudo add-apt-repository universe

          # Add ROS 2 GPG key and repository
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

          # 2. Install ROS 2 Base, pip, and colcon extensions
          sudo apt update
          # ros-base provides core tools (ros2, colcon, etc.) without GUI dependencies
          sudo apt install -y \
            ros-${{ env.ROS_DISTRO }}-ros-base \
            python3-pip \
            python3-colcon-common-extensions \
            python3-rosdep
          
          # 3. Initialize and update rosdep (now using the system-installed rosdep)
          sudo rosdep init || true
          rosdep update

      - name: Install custom Python Dependencies (OpenVINO)
        # Manually install non-rosdep Python packages
        run: |
          sudo python3 -m pip install openvino-dev
          
      - name: Repair and Install remaining system dependencies
        run: |
          # Source the base ROS environment
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash

          # FIX 1: Attempt to install libunwind-dev explicitly to solve dependency conflicts
          sudo apt-get update
          sudo apt-get install -y libunwind-dev || sudo apt-get install -y libunwind7-dev || true

          # FIX 2: Attempt to fix broken packages and autoremove
          sudo apt-get install -f
          sudo apt autoremove -y
          sudo apt update # Re-update after cleanup

          # Install all required system dependencies
          rosdep install \
            --from-paths src \
            --ignore-src \
            -y \
            --rosdistro ${{ env.ROS_DISTRO }} \
            --skip-keys "python3-openvino-dev"
            
      - name: Perform Colcon Build
        run: |
          # Source the ROS environment
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash

          # Build the workspace
          # CRITICAL FIX: Ignore packages known to cause symlink conflicts when building from source 
          # alongside a standard ROS installation. They will use the system-installed versions.
          colcon build --symlink-install --packages-ignore \
            turtlebot3_manipulation_gazebo \
            turtlebot3_gazebo \
            turtlebot3_simulations \
            turtlebot3_description
          
          echo "Colcon build succeeded."