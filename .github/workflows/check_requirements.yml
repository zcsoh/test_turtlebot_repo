name: ROS 2 Dependency Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ROS_DISTRO: humble

jobs:
  check-deps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip

      - name: Setup ROS 2 Environment (Minimal)
        run: |
          # 1. Install rosdep globally using sudo (The final fix for user/sudo conflicts)
          sudo python3 -m pip install rosdep
          
          # 2. Initialize rosdep. Now works because rosdep is globally installed.
          sudo rosdep init || true
          
          # 3. Update rosdep sources
          rosdep update
          
      - name: Check package dependencies
        run: |
          rosdep install --from-paths src --ignore-src -y --simulate
          echo "ROS 2 dependency check passed (simulated)."