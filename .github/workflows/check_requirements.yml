name: ROS 2 Dependency Check

on:
  push:
    branches:
      - main  # Or master, or your default branch
  pull_request:
    branches:
      - main  # Or master, or your default branch

jobs:
  check-deps:
    # Use a Linux environment that is easy to set up with ROS 2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          # Ensure apt is up to date and install python3-pip globally
          sudo apt update
          sudo apt install -y python3-pip

      - name: Setup ROS 2 Environment (Minimal)
        run: |
          # 1. CRITICAL FIX: Install rosdep globally using sudo.
          # This avoids all PATH/PYTHONPATH conflicts between the user and sudo environments.
          sudo python3 -m pip install rosdep
          
          # 2. Add the global bin directory to the PATH for the entire job
          # (This may not be strictly necessary, but is good practice if using a virtual environment)
          # On Ubuntu, the global binary is usually found without explicit PATH modification.

          # 3. Initialize rosdep. Now we can use the simple, clean sudo command.
          sudo rosdep init || true
          
          # 4. Update rosdep sources
          rosdep update
          
      - name: Check package dependencies
        # This command checks all packages in the src directory for missing dependencies.
        run: |
          rosdep install --from-paths src --ignore-src -y --simulate
          echo "ROS 2 dependency check passed (simulated)."