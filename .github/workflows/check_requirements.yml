name: ROS 2 Dependency Check

on:
  push:
    branches:
      - main  # Or master, or your default branch
  pull_request:
    branches:
      - main  # Or master, or your default branch

jobs:
  check-deps:
    # Use a Linux environment that is easy to set up with ROS 2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip

      - name: Setup ROS 2 Environment (Minimal)
        run: |
          # 1. Install rosdep to the user's local directory
          python3 -m pip install --user rosdep
          
          # 2. Add the user's binary path to the GitHub Actions PATH for non-sudo calls (like 'rosdep update')
          ROSDEP_BIN_PATH=$(python3 -m site --user-base)/bin
          echo "$ROSDEP_BIN_PATH" >> $GITHUB_PATH

          # 3. Determine the user site-packages path where the 'rosdep2' module lives
          USER_SITE_PACKAGES=$(python3 -m site --user-site)

          # 4. Initialize rosdep. CRITICAL FIX: 
          #    We use 'sudo env PYTHONPATH=...' to explicitly tell Python where to find the 
          #    user-installed 'rosdep' modules when running with elevated privileges.
          sudo env PYTHONPATH="$USER_SITE_PACKAGES:$PYTHONPATH" python3 -m rosdep init || true
          
          # 5. Update rosdep sources (this should now work)
          rosdep update
          
      - name: Check package dependencies
        # This command checks all packages in the src directory for missing dependencies.
        run: |
          rosdep install --from-paths src --ignore-src -y --simulate
          echo "ROS 2 dependency check passed (simulated)."