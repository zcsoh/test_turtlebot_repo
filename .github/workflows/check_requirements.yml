name: ROS 2 Dependency Check

on:
  push:
    branches:
      - main  # Or master, or your default branch
  pull_request:
    branches:
      - main  # Or master, or your default branch

env:
  # Set the correct ROS distribution for dependency resolution
  ROS_DISTRO: humble

jobs:
  check-deps:
    # Use the stable Ubuntu version for ROS 2 Humble
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip lsb-release curl
          
      - name: Setup ROS 2 Environment (Minimal)
        run: |
          # 1. Install rosdep globally (Fixes previous module/sudo errors)
          sudo python3 -m pip install rosdep
          
          # 2. Initialize rosdep.
          sudo rosdep init || true
          
          # 3. Update rosdep sources
          rosdep update
          
      - name: Install non-rosdep Python Dependencies
        run: |
          # OpenVINO is not in the rosdep database, so we install it directly.
          # We install globally using sudo/pip to match the rosdep installation method.
          sudo python3 -m pip install openvino-dev
          
      - name: Check package dependencies
        run: |
          # CRITICAL FIX: Use --skip-keys to ignore the non-rosdep package.
          rosdep install \
            --from-paths src \
            --ignore-src \
            -y \
            --simulate \
            --rosdistro ${{ env.ROS_DISTRO }} \
            --skip-keys "python3-openvino-dev"
            
          echo "ROS 2 dependency check passed (simulated)."